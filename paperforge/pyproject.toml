[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperforge"
version = "0.1.0"
description = "Journal template + research repo -> LaTeX manuscript draft with real-data figures"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "matplotlib>=3.8",
    "numpy",
    "pandas",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
paperforge = "paperforge.cli:main"

[tool.setuptools.packages.find]
include = ["paperforge*"]

[tool.setuptools.package-data]
paperforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
